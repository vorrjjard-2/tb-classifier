name: default

data:
  root: data/TBX11K
  image_size: 512
  batch_size: 16
  num_workers: 4
  pin_memory: true

model:
  arch: resnet50
  num_classes: 3
  pretrained: true

training:
  epochs: 30
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  precision: "32"
  seed: 42
  log_dir: experiments/results
  wandb_project: tb-classifier
  wandb_run_name: null
