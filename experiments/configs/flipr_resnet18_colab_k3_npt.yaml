name: flipr_resnet18_colab

data:
  root: data/tbx11k
  image_size: 512
  batch_size: 16
  num_workers: 4
  pin_memory: true
  augment : false

model:
  arch: resnet18
  num_classes: 3
  pretrained: false
  use_flipr: true
  keep_stages: 3

training:
  epochs: 100
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  precision: bf16-mixed
  seed: 42
  class_weights: balanced
  log_dir: /content/drive/MyDrive/tb-classifier-runs
  wandb_project: tb-classifier
  wandb_run_name: flipr-resnet18-colab-001
