[project]
name = "tb-classifier"
version = "0.1.0"
description = "Custom TB detection classifier for the ALIVE implementation"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "lightning",
    "torchmetrics",
    "albumentationsx",
    "opencv-python-headless",
    "pillow",
    "pydicom",
    "numpy",
    "pandas",
    "scikit-learn",
    "pyyaml",
    "tensorboard",
    "wandb",
    "matplotlib",
    "tqdm",
    "seaborn>=0.13.2",
    "einops>=0.8.2",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
notebooks = [
    "jupyter",
    "ipykernel",
    "ipywidgets",
    "seaborn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tb_classifier"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
